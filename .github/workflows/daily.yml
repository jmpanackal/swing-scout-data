name: daily-data

on:
  schedule:
    - cron: "15 23 * * 1-5"   # 23:15 UTC weekdays = after the US close in both EST and EDT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous data (for IV history)
        run: |
          git fetch --depth 1 origin data:prevdata || echo "no data branch yet"
          mkdir -p prev
          if git rev-parse --verify prevdata >/dev/null 2>&1; then
            git --work-tree=prev checkout prevdata -- . && git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q yfinance pandas numpy lxml pyyaml

      - name: Offline tests
        run: python test_offline.py

      - name: Build
        run: python build.py --out out --prev prev

      - name: Publish to data branch (single commit, history not kept)
        run: |
          cd out
          git init -q -b data
          git config user.name "swing-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(jq -r .data_asof meta.json) built $(jq -r .built_utc meta.json)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
