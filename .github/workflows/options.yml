name: intraday-options

on:
  schedule:
    - cron: "30 19 * * 1-5"   # 19:30 UTC = 2:30pm EST / 3:30pm EDT, inside market hours year-round
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data          # never overlaps the nightly price job
  cancel-in-progress: false

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy pyyaml
      - name: Refresh option chains
        run: python src/build.py --mode options --out data --config src/config.yaml
      - name: Commit to data branch
        run: |
          cd data
          git config user.name "swing-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "options $(jq -r .quoted_utc options_meta.json)" || exit 0
          git push -q origin data
